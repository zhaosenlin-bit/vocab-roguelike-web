<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词域探险 · 网页版 - Word Realm Roguelike</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0c0f14; color: #e8eef5;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    image-rendering: auto;
    touch-action: none;
    cursor: crosshair;
  }
  #loading {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    background: #0c0f14; font-size: 18px; letter-spacing: 2px;
  }
  #loading .bar { width: 320px; height: 8px; background: #1d2633; border-radius: 4px; overflow: hidden; }
  #loading .fill { height: 100%; width: 0%; background: #58c7ff; transition: width .2s; }
  #hint {
    position: fixed; left: 12px; bottom: 8px; z-index: 5;
    font-size: 12px; color: #5d6a7a; letter-spacing: 1px;
  }
  /* ---------- 登录界面（手绘黑边 / 白底 / 黄字） ---------- */
  #login {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #15203a 0%, #06090f 70%);
  }
  .login-card {
    background: #FFFFFF;
    border: 3px solid #000000;
    border-radius: 14px;
    padding: 30px 36px 26px;
    width: 400px;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.85);
    position: relative;
  }
  .login-card::before, .login-card::after {
    content: ""; position: absolute; inset: 6px; border-radius: 10px;
    pointer-events: none;
  }
  .login-title {
    margin: 0 0 20px; font-size: 24px; color: #000000;
    text-align: center; letter-spacing: 2px; font-weight: bold;
  }
  .login-title span { color: #FFD500; }
  .login-tabs {
    display: flex; margin-bottom: 14px; gap: 8px;
  }
  .login-tab {
    flex: 1; padding: 9px 0;
    background: #FFFFFF; color: #FFD500;
    border: 3px solid #000000; border-radius: 8px;
    cursor: pointer; font-size: 15px; font-weight: bold;
    font-family: inherit;
    transition: transform .08s ease;
  }
  .login-tab:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 #000; }
  .login-tab.active {
    background: #FFD500; color: #000000;
  }
  .login-input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 10px;
    background: #FFFFFF; border: 3px solid #000000;
    border-radius: 8px; color: #000000; font-size: 14px; outline: none;
    font-family: inherit;
  }
  .login-input:focus { background: #FFFCEB; }
  .login-input::placeholder { color: #888; }
  .login-error {
    min-height: 18px; color: #D04040; font-size: 12px;
    margin-bottom: 6px; text-align: center; font-weight: bold;
  }
  .login-btn {
    width: 100%; padding: 12px; border: 3px solid #000000; border-radius: 10px;
    font-size: 16px; cursor: pointer; margin-bottom: 10px;
    font-family: inherit; font-weight: bold;
    background: #FFFFFF; color: #FFD500;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .login-btn:hover { transform: translate(-2px,-2px); box-shadow: 3px 3px 0 #000; }
  .login-btn:active { transform: translate(0,0); box-shadow: none; }
  .login-btn.primary {
    background: #FFD500; color: #000000;
  }
  .login-btn.secondary {
    background: #FFFFFF; color: #FFD500;
  }
  .login-hint {
    margin-top: 10px; font-size: 11px; color: #555;
    text-align: center; line-height: 1.5;
  }
</style>
</head>
<body>
<div id="login" style="display:none;">
  <div class="login-card">
    <h1 class="login-title">词<span>域</span>探险 · 账号登录</h1>
    <div class="login-tabs">
      <button class="login-tab active" data-mode="login" type="button">登录</button>
      <button class="login-tab" data-mode="register" type="button">注册</button>
    </div>
    <input id="login-username" class="login-input" placeholder="账号（3-20位）" autocomplete="username" maxlength="20">
    <input id="login-password" class="login-input" type="password" placeholder="密码（至少6位）" autocomplete="current-password" maxlength="40">
    <input id="login-password2" class="login-input" type="password" placeholder="再次输入密码" autocomplete="new-password" maxlength="40" style="display:none;">
    <div id="login-error" class="login-error"></div>
    <button id="login-submit" class="login-btn primary" type="button">登录</button>
    <button id="login-guest" class="login-btn secondary" type="button">游客试玩（不绑定账号）</button>
    <div class="login-hint">账号与进度仅保存在本机浏览器，注册后可在此设备记住金币、宠物和战绩。</div>
  </div>
</div>
<div id="loading" style="display:none;"><div>正在加载词库与素材…</div><div class="bar"><div class="fill" id="fill"></div></div><div id="loadText">0%</div></div>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">操作：WASD 移动 · 鼠标瞄准 · 左键发射 · E 拾取/开箱 · Space 闪避 · Q 护盾药 · H 治疗针剂 · Tab 记忆书 · F11 全屏</div>
<script src="game.js?v=8"></script>
</body>
</html>
