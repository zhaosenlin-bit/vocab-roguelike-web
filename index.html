<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词域探险 · 网页版 - Word Realm Roguelike</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0c0f14; color: #e8eef5;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    image-rendering: auto;
    touch-action: none;
    cursor: crosshair;
  }
  #loading {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    background: #0c0f14; font-size: 18px; letter-spacing: 2px;
  }
  #loading .bar { width: 320px; height: 8px; background: #1d2633; border-radius: 4px; overflow: hidden; }
  #loading .fill { height: 100%; width: 0%; background: #58c7ff; transition: width .2s; }
  #hint {
    position: fixed; left: 12px; bottom: 8px; z-index: 5;
    font-size: 12px; color: #5d6a7a; letter-spacing: 1px;
  }
  /* ---------- 登录界面 ---------- */
  #login {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #15203a 0%, #06090f 70%);
  }
  .login-card {
    background: rgba(18,24,36,0.96);
    border: 1px solid rgba(120,160,210,0.25);
    border-radius: 14px;
    padding: 30px 36px 24px;
    width: 380px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6);
  }
  .login-title { margin: 0 0 18px; font-size: 22px; color: #ffe9a3; text-align: center; letter-spacing: 2px; font-weight: bold; }
  .login-tabs { display: flex; margin-bottom: 14px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(120,160,210,0.3); }
  .login-tab { flex: 1; padding: 9px 0; background: rgba(40,52,72,0.6); color: #c4d2e2; border: none; cursor: pointer; font-size: 14px; font-family: inherit; }
  .login-tab.active { background: rgba(88,160,220,0.4); color: #fff; }
  .login-input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 10px;
    background: rgba(20,28,42,0.9); border: 1px solid rgba(120,160,210,0.3);
    border-radius: 6px; color: #e8eef5; font-size: 14px; outline: none;
    font-family: inherit;
  }
  .login-input:focus { border-color: rgba(120,200,255,0.7); }
  .login-error { min-height: 18px; color: #ff8896; font-size: 12px; margin-bottom: 6px; text-align: center; }
  .login-btn {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    font-size: 15px; cursor: pointer; margin-bottom: 8px;
    font-family: inherit;
  }
  .login-btn.primary { background: linear-gradient(180deg, #69c1ff, #3a8acc); color: #fff; font-weight: bold; }
  .login-btn.primary:hover { background: linear-gradient(180deg, #7fcfff, #4a9adc); }
  .login-btn.secondary { background: rgba(80,70,110,0.6); color: #e0d8f0; }
  .login-btn.secondary:hover { background: rgba(100,86,130,0.7); }
  .login-hint { margin-top: 10px; font-size: 11px; color: #6d7a8a; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div id="login" style="display:none;">
  <div class="login-card">
    <h1 class="login-title">词域探险 · 账号登录</h1>
    <div class="login-tabs">
      <button class="login-tab active" data-mode="login" type="button">登录</button>
      <button class="login-tab" data-mode="register" type="button">注册</button>
    </div>
    <input id="login-username" class="login-input" placeholder="账号（3-20位）" autocomplete="username" maxlength="20">
    <input id="login-password" class="login-input" type="password" placeholder="密码（至少6位）" autocomplete="current-password" maxlength="40">
    <input id="login-password2" class="login-input" type="password" placeholder="再次输入密码" autocomplete="new-password" maxlength="40" style="display:none;">
    <div id="login-error" class="login-error"></div>
    <button id="login-submit" class="login-btn primary" type="button">登录</button>
    <button id="login-guest" class="login-btn secondary" type="button">游客试玩（不绑定账号）</button>
    <div class="login-hint">账号与进度仅保存在本机浏览器，注册后可在此设备记住金币、宠物和战绩。</div>
  </div>
</div>
<div id="loading" style="display:none;"><div>正在加载词库与素材…</div><div class="bar"><div class="fill" id="fill"></div></div><div id="loadText">0%</div></div>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">操作：WASD 移动 · 鼠标瞄准 · 左键发射 · E 拾取/开箱 · Space 闪避 · Q 护盾药 · H 治疗针剂 · Tab 记忆书 · F11 全屏</div>
<script src="game.js?v=6"></script>
</body>
</html>
